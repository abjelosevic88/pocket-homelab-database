name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-database ./cmd/pocket-database
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pdb DEMO_DATA=true AUTH_MODE=none DOCKER_HOST=off ./pocket-database &
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/overview | grep -q '"connections"'
          ID=$(curl -fsS http://localhost:8080/api/v1/connections | grep -o '"id":[0-9]*,"name":"Shop"' | grep -o '[0-9]*' | head -1)
          curl -fsS "http://localhost:8080/api/v1/connections/$ID/rows?name=orders&limit=2" | grep -q '"total"'
          curl -fsS -X POST "http://localhost:8080/api/v1/connections/$ID/query" -d '{"sql":"SELECT COUNT(*) FROM customers"}' | grep -q '"rows":\[\[240\]\]'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-database:pr
